const pageQuiz = document.getElementById("page-quiz");
const pageResult = document.getElementById("page-result");
const pwdInput = document.getElementById("pwdInput");
const pwdTip = document.getElementById("pwdTip");
const startBtn = document.getElementById("startBtn");
const qIndexTip = document.getElementById("qIndexTip");
const questionText = document.getElementById("questionText");
const optionWrap = document.getElementById("optionWrap");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const resImg = document.getElementById("resImg");
const resBody = document.getElementById("resBody");
const copyShareLink = document.getElementById("copyShareLink");
const retestBtn = document.getElementById("retestBtn");
const goodGiftBtn = document.getElementById("goodGiftBtn");
const popupGift = document.getElementById("popupGift");
const closePopup = document.getElementById("closePopup");


startBtn.onclick = function(){
    let inputVal = pwdInput.value.trim();
    if(!inputVal){
        pwdTip.innerText = "请输入密码";
        return;
    }
    if(!passwordPool.includes(inputVal)){
        pwdTip.innerText = "密码错误，请核对";
        return;
    }
    let rec = getPwdUsedRecord();
    let used = rec[inputVal] || 0;
    if(used >=3){
        pwdTip.innerText = "该密码已耗尽测试次数";
        return;
    }
    rec[inputVal] = used + 1;
    savePwdRecord(rec);
    switchPage("quiz");
    currentIndex = 0;
    userAnswers = [];
    renderQuestion();
};

function switchPage(name){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    if(name === "pwd") pagePwd.classList.add("active");
    if(name === "quiz") pageQuiz.classList.add("active");
    if(name === "result") pageResult.classList.add("active");
}

function renderQuestion(){
    let item = questionList[currentIndex];
    qIndexTip.innerText = `第 ${currentIndex+1} / ${questionList.length} 题`;
    questionText.innerText = item.q;
    optionWrap.innerHTML = "";
    item.o.forEach((opt,idx)=>{
        let div = document.createElement("div");
        div.className = "option-item";
        div.innerText = opt;
        if(userAnswers[currentIndex] === idx){
            div.classList.add("selected");
        }
        div.onclick = function(){
            userAnswers[currentIndex] = idx;
            document.querySelectorAll(".option-item").forEach(d=>d.classList.remove("selected"));
            div.classList.add("selected");
        };
        optionWrap.appendChild(div);
    });
    prevBtn.disabled = (currentIndex === 0);
}

prevBtn.onclick = function(){
    if(currentIndex>0){
        currentIndex--;
        renderQuestion();
    }
};

nextBtn.onclick = function(){
    if(userAnswers[currentIndex] === undefined){
        alert("请选择一个选项");
        return;
    }
    if(currentIndex < questionList.length -1){
        currentIndex++;
        renderQuestion();
    }else{
        calcResult();
    }
};

function calcResult(){
    let counter = [0,0,0,0,0,0];
    userAnswers.forEach(ansIdx=>{
        counter[ansIdx]++;
    });
    let maxIdx = 0;
    let maxVal = counter[0];
    for(let i=1;i<counter.length;i++){
        if(counter[i]>maxVal){
            maxVal = counter[i];
            maxIdx = i;
        }
    }
    let res = resultSet[maxIdx];
    resImg.src = res.img;
    resBody.innerHTML = `<h3 style="text-align:center;color:#7b4bb3;margin-bottom:10px">${res.title}</h3>` + res.body;
    currentShareUrl = window.location.href;
    switchPage("result");
}

copyShareLink.onclick = async function(){
    try{
        await navigator.clipboard.writeText(currentShareUrl);
        alert("链接已复制，可以转发给好友");
    }catch(e){
        alert("复制失败，请手动复制浏览器地址");
    }
};

retestBtn.onclick = function(){
    pwdInput.value = "";
    switchPage("pwd");
};

goodGiftBtn.onclick = function(){
    popupGift.classList.add("show");
};
closePopup.onclick = function(){
    popupGift.classList.remove("show");
};
</script>
</body>
</html>
