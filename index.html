<!DOCTYPE html>

<head>

</head>

//密码配置，每个密码最多3次
const pwdConfig = {
    "test001":{remain:3}
};

//页面dom
const pagePwd = document.getElementById("page-pwd");
const pageQuestion = document.getElementById("page-question");
const pageResult = document.getElementById("page-result");
const pwdInput = document.getElementById("pwdInput");
const startBtn = document.getElementById("startBtn");
const qText = document.getElementById("qText");
const optBox = document.getElementById("optBox");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const saveBtn = document.getElementById("saveBtn");
const copyLinkBtn = document.getElementById("copyLinkBtn");
const reTestBtn = document.getElementById("reTestBtn");
const goodBtn = document.getElementById("goodBtn");
const popGood = document.getElementById("popGood");
const closePopBtn = document.getElementById("closePopBtn");
const resImg = document.getElementById("resImg");
const resTitle = document.getElementById("resTitle");
const resBody = document.getElementById("resBody");

let currentIndex = 0;
let userAnswer = [];
let currentPwd = "";

//密码校验
startBtn.onclick = function(){
    let pwd = pwdInput.value.trim();
    if(!pwd){
        alert("请输入密码");
        return;
    }
    if(!pwdConfig[pwd]){
        alert("密码错误");
        return;
    }
    if(pwdConfig[pwd].remain <= 0){
        alert("该密码测试次数已经用尽");
        return;
    }
    currentPwd = pwd;
    //进入答题
    pagePwd.classList.add("hide");
    pageQuestion.classList.remove("hide");
    currentIndex = 0;
    userAnswer = [];
    renderQuestion();
};

//渲染题目
function renderQuestion(){
    const item = questionList[currentIndex];
    qText.innerText = (currentIndex+1)+" / "+questionList.length + "  " + item.q;
    optBox.innerHTML = "";
    item.o.forEach((opt,idx)=>{
        const div = document.createElement("div");
        div.className = "option-item";
        div.innerText = opt;
        if(userAnswer[currentIndex] === idx){
            div.style.background="#e8ddf7";
        }
        div.onclick = ()=>{
            userAnswer[currentIndex] = idx;
            renderQuestion();
        }
        optBox.appendChild(div);
    })
    prevBtn.disabled = currentIndex === 0;
}

//上一题
prevBtn.onclick = function(){
    if(currentIndex>0){
        currentIndex--;
        renderQuestion();
    }
}

//下一题
nextBtn.onclick = function(){
    if(userAnswer[currentIndex]===undefined){
        alert("请选择一个选项");
        return;
    }
    if(currentIndex < questionList.length -1){
        currentIndex++;
        renderQuestion();
    }else{
        //全部题目做完，计算结果
        calcResult();
    }
}

//计算测评结果，简单统计倾向
function calcResult(){
    let score = [0,0,0,0,0,0];
    userAnswer.forEach((ans,idx)=>{
        const q = questionList[idx];
        const aText = q.o[ans];
        //简单倾向计分
        if(aText.startsWith("A")){
            score[0] += 1.1;
            score[2] += 0.6;
            score[4] +=0.8;
        }else{
            score[1] +=1.1;
            score[3] +=0.7;
            score[5] +=1.0;
        }
    })
    let maxIndex = 0;
    let maxVal = score[0];
    for(let i=0;i<score.length;i++){
        if(score[i]>maxVal){
            maxVal = score[i];
            maxIndex = i;
        }
    }
    //消耗一次次数
    pwdConfig[currentPwd].remain -=1;
    //渲染结果页
    showResult(maxIndex);
}

function showResult(idx){
    pageQuestion.classList.add("hide");
    pageResult.classList.remove("hide");
    const res = resultSet[idx];
    resImg.src = res.img;
    resTitle.innerText = res.title;
    resBody.innerHTML = res.body;
}

//保存图片，使用国内CDN修复版
saveBtn.onclick = async function () {
    try {
        saveBtn.disabled = true;
        saveBtn.innerText = "生成中...";
        const resultDom = document.getElementById("result-wrap");

        const canvas = await html2canvas(resultDom, {
            scale: window.devicePixelRatio,
            useCORS: true,
            allowTaint: false,
            backgroundColor:'#e8e0f8',
            imageTimeout:15000
        });

        canvas.toBlob(function(blob){
            if(!blob){
                alert("生成失败，请截图保存页面");
                saveBtn.disabled = false;
                saveBtn.innerText = "保存结果生成长图";
                return;
            }
            const blobUrl = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = blobUrl;
            link.download = "童话测评结果.png";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(blobUrl);

            saveBtn.disabled = false;
            saveBtn.innerText = "保存结果生成长图";
        },'image/png');

    } catch (e) {
        console.error(e);
        alert("图片生成失败！浏览器限制，请直接截图保存结果页面。");
        saveBtn.disabled = false;
        saveBtn.innerText = "保存结果生成长图";
    }
};

//复制链接
copyLinkBtn.onclick = async function(){
    try{
        await navigator.clipboard.writeText(location.href);
        alert("链接复制成功，可以发给好友！");
    }catch(e){
        alert("复制失败，请手动复制浏览器地址栏网址");
    }
}

//再测一次
reTestBtn.onclick = function(){
    pageResult.classList.add("hide");
    pagePwd.classList.remove("hide");
    pwdInput.value = "";
    userAnswer = [];
    currentIndex=0;
}

//好评有礼弹窗
goodBtn.onclick = function(){
    popGood.style.display = "flex";
}
closePopBtn.onclick = function(){
    popGood.style.display = "none";
}
</script>
</body>
</html>
