//业务逻辑
let current = 0;
let userAnswers = [];

//dom
const pagePwd = document.getElementById("pagePwd");
const pageQuiz = document.getElementById("pageQuiz");
const pageResult = document.getElementById("pageResult");
const pwdInput = document.getElementById("pwdInput");
const startBtn = document.getElementById("startBtn");
const qText = document.getElementById("qText");
const optWrap = document.getElementById("optWrap");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const resImg = document.getElementById("resImg");
const resTitle = document.getElementById("resTitle");
const resBody = document.getElementById("resBody");
const savePicBtn = document.getElementById("savePicBtn");
const copyLinkBtn = document.getElementById("copyLinkBtn");
const retestBtn = document.getElementById("retestBtn");
const goodGiftBtn = document.getElementById("goodGiftBtn");
const popGift = document.getElementById("popGift");
const closePop = document.getElementById("closePop");
const resultDom = document.getElementById("resultDom");

//获取密码测试记录
function getTestRecord(){
    if(!USE_LOCAL_STORAGE) return {};
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return {};
    return JSON.parse(raw);
}
function saveTestRecord(record){
    if(!USE_LOCAL_STORAGE) return;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(record));
}

//密码校验+次数限制
startBtn.onclick = function(){
    const pwd = pwdInput.value.trim();
    if(!validPasswords.includes(pwd)){
        alert("密码错误，请核对！");
        return;
    }
    const record = getTestRecord();
    const count = record[pwd] || 0;
    if(count >= MAX_TEST_TIMES){
        alert("该密码已达到最大测试次数"+MAX_TEST_TIMES+"次，无法继续测试！");
        return;
    }
    record[pwd] = count + 1;
    saveTestRecord(record);
    enterQuiz();
};

function enterQuiz(){
    pagePwd.classList.remove("active");
    pageQuiz.classList.add("active");
    current = 0;
    userAnswers = Array(questions.length).fill(null);
    renderQuestion();
}

function renderQuestion(){
    const item = questions[current];
    qText.innerText = (current+1)+" / "+questions.length + " ｜ "+item.q;
    optWrap.innerHTML = "";
    item.o.forEach((opt,idx)=>{
        const div = document.createElement("div");
        div.className = "opt-item";
        div.innerText = opt;
        if(userAnswers[current] === idx){
            div.style.background="#e3daf8";
            div.style.borderColor="#9068e2";
        }
        div.onclick = ()=>{
            userAnswers[current] = idx;
            renderQuestion();
        }
        optWrap.appendChild(div);
    })
    prevBtn.disabled = current===0;
    prevBtn.style.opacity = current===0?"0.4":"1";
    nextBtn.innerText = (current === questions.length-1) ? "提交查看结果":"下一题";
}

prevBtn.onclick = function(){
    if(current>0){
        current -=1;
        renderQuestion();
    }
}

nextBtn.onclick = function(){
    if(userAnswers[current]===null){
        alert("请选择一个选项！");
        return;
    }
    if(current < questions.length-1){
        current += 1;
        renderQuestion();
    }else{
        calcResult();
    }
}

//简单计分逻辑
function calcResult(){
    let score = [0,0,0,0,0,0];
    userAnswers.forEach((ans,i)=>{
        const q = questions[i];
        if(ans===0) score[0]++;
        if(ans===1) score[1]++;
        if(ans===2) score[2]++;
        if(ans===3) score[3]++;
    })
    let maxIndex = 0;
    for(let i=0;i<score.length;i++){
        if(score[i]>score[maxIndex]) maxIndex=i;
    }
    showResult(maxIndex);
}

function showResult(idx){
    pageQuiz.classList.remove("active");
    pageResult.classList.add("active");
    const r = resultList[idx];
    resImg.src = r.img;
    resTitle.innerText = r.title;
    resBody.innerText = r.body;
}

//生成长图下载
savePicBtn.onclick = async function(){
    try {
        savePicBtn.disabled = true;
        savePicBtn.innerText = "正在生成图片…";
        const canvas = await html2canvas(resultDom,{
            useCORS:true,
            scale:2,
            backgroundColor:"#ffffff"
        });
        const link = document.createElement("a");
        link.download = "童话人格测试结果.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
        savePicBtn.disabled = false;
        savePicBtn.innerText = "保存结果生成长图";
    }catch(e){
        alert("图片生成失败！");
        savePicBtn.disabled = false;
        savePicBtn.innerText = "保存结果生成长图";
    }
}

copyLinkBtn.onclick = async function(){
    try{
        await navigator.clipboard.writeText(location.href);
        alert("页面链接已经复制，可以分享给好友！");
    }catch(err){
        alert("复制失败，请手动复制浏览器地址栏网址");
    }
}

retestBtn.onclick = function(){
    pageResult.classList.remove("active");
    pagePwd.classList.add("active");
    pwdInput.value="";
}

goodGiftBtn.onclick = function(){
    popGift.classList.add("show");
}

closePop.onclick = function(){
    popGift.classList.remove("show");
}
</script>
